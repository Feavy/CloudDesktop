# Web client for a TigerVNC/XFCE desktop.
#
#   kubectl apply -f deploy/kubernetes.yaml
#
# Assumes you already have:
#   - a pod/deployment running XFCE + TigerVNC + websockify
#   - a Traefik forwardAuth Middleware (named `desktop-auth` below — rename it)
#
# If websockify is exposed by Traefik, set WS_URL so the browser talks to it
# directly and the built-in WS→TCP bridge is bypassed.
---
apiVersion: v1
kind: Service
metadata:
  name: desktop-web
  labels:
    app.kubernetes.io/name: desktop-web
spec:
  selector:
    app.kubernetes.io/name: desktop-web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: desktop-web
  labels:
    app.kubernetes.io/name: desktop-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: desktop-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: desktop-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        # Gives the emptyDir volumes below group ownership so uid 1000 can
        # write to them, which is what makes the non-root setup work.
        fsGroup: 1000
      containers:
        - name: web
          # Published to GHCR by .github/workflows/publish.yml on every push
          # to main. Swap the owner if you fork this again.
          image: ghcr.io/feavy/clouddesktop-client:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            # Where the file transfer reads and writes (~/Desktop, ~/Downloads).
            # Must be writable: readOnlyRootFilesystem is on below, and the
            # upload endpoint creates these directories on first use.
            #
            # For clouddesktop-client this is simply a writable scratch home;
            # node:alpine's own home is /home/node. For clouddesktop-full, set
            # this to the passwd home of the user install.sh settled on
            # (/home/ubuntu by default) and mount the volume there instead.
            - name: HOME
              value: "/home/desktop"
            # --- VNC backend -------------------------------------------
            # Use 127.0.0.1 with the built-in bridge when this container is a
            # sidecar in the same pod as TigerVNC; use the pod IP or a
            # Service name when it is a separate deployment.
            - name: VNC_HOST
              value: "127.0.0.1"
            - name: VNC_PORT
              value: "5900"
            # Point at your websockify route to skip the built-in bridge,
            # e.g. wss://desktop.example.com/websockify
            # - name: WS_URL
            #   value: "wss://desktop.example.com/websockify"
            # --- X display used for xrandr / xclip / wmctrl ------------
            - name: DISPLAY
              value: ":1"
            # Optional: the browser tab / page title of the web client.
            # Defaults to CloudDesktop.
            # - name: PAGE_TITLE
            #   value: "My Desktop"
            # The dock's "Restart Desktop" button needs no configuration here.
            # With the desktop in a container of its own (the setup this file
            # assumes) the browser ends the session over VNC by pressing the
            # shortcut start-vnc's image binds to xfce4-session-logout --logout,
            # and Kubernetes restarts the desktop container. The web client
            # stays up and reconnects. If the desktop is third-party and does
            # not bind that chord, point it at Ctrl+Alt+Shift+R, or set
            # RESTART_MODE=command / off to change or hide the action.
            # - name: RESTART_MODE
            #   value: "session"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Uploads are staged in /tmp before being moved into place
            - name: tmp
              mountPath: /tmp
            # HOME. Required because readOnlyRootFilesystem is on, and the
            # file transfer writes to $HOME/Desktop and $HOME/Downloads.
            # Use a PersistentVolumeClaim instead of emptyDir if you want
            # uploaded files to survive a restart.
            - name: home
              mountPath: /home/desktop
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
---
# TLS termination and authentication are Traefik's job, not the app's.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: desktop-web
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`desktop.example.com`)
      middlewares:
        - name: desktop-auth   # your forwardAuth middleware
      services:
        - name: desktop-web
          port: 3000