<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <meta name="msapplication-TileColor" content="#000000">
  <meta name="msapplication-navbutton-color" content="#000000">
  <link rel="manifest" href="/manifest.json?cv=%CACHE_VERSION%">
  <link rel="apple-touch-icon" href="/icon-192.png?cv=%CACHE_VERSION%">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?cv=%CACHE_VERSION%">
  <title>CloudDesktop</title>
  <link rel="stylesheet" href="/css/desktop.css?cv=%CACHE_VERSION%">
  <link rel="stylesheet" href="/css/notifications.css?cv=%CACHE_VERSION%">
</head>
<body>

  <!-- Notification container (toasts) -->
  <div id="notification-container"></div>

  <!-- Notification dropdown -->
  <div id="notification-dropdown" hidden>
    <div class="notif-dropdown-header">Notifications</div>
    <div id="notification-list"></div>
  </div>

  <!-- Status overlay -->
  <div id="status-overlay" class="status-overlay">
    <div class="status-spinner"></div>
    <div id="status-text">Connecting to desktop…</div>
  </div>

  <!-- noVNC canvas -->
  <div id="vnc-container"></div>

  <!-- Mobile floating toolbar (touch devices only, shown via JS) -->
  <div id="mobile-toolbar" class="mobile-toolbar" hidden>
    <button class="mob-btn" id="mob-fullscreen" title="Fullscreen">
      <svg class="fs-icon-expand" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 3H3v4"/><path d="M13 3h4v4"/><path d="M7 17H3v-4"/><path d="M13 17h4v-4"/>
      </svg>
      <svg class="fs-icon-compress" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" hidden>
        <path d="M3 7h4V3"/><path d="M17 7h-4V3"/><path d="M3 13h4v4"/><path d="M17 13h-4v4"/>
      </svg>
    </button>
    <button class="mob-btn" id="mob-zoom-fit" title="Fit Screen">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <rect x="3" y="3" width="14" height="14" rx="2"/>
        <path d="M3 7h14"/>
      </svg>
    </button>
    <div class="mob-sep"></div>
    <button class="mob-btn" id="mob-keyboard" title="Keyboard">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <rect x="1" y="5" width="18" height="11" rx="2"/>
        <line x1="5" y1="8.5" x2="7" y2="8.5"/><line x1="9" y1="8.5" x2="11" y2="8.5"/><line x1="13" y1="8.5" x2="15" y2="8.5"/>
        <line x1="6" y1="12.5" x2="14" y2="12.5"/>
      </svg>
    </button>
  </div>

  <!-- Virtual mouse pointer (always visible on touch devices) -->
  <div id="touch-cursor" class="touch-cursor" hidden>
    <svg class="cursor-arrow" viewBox="0 0 24 28" width="20" height="24">
      <path d="M5.5 1.5L18.5 12.5l-5.8 1.3-3.2 6.2z" fill="white" stroke="#222" stroke-width="1.5" stroke-linejoin="round"/>
    </svg>
  </div>

  <!-- Drop overlay -->
  <div id="drop-overlay" class="drop-overlay" hidden>
    <div class="drop-box">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <p>Drop files to upload to Desktop</p>
    </div>
  </div>

  <!-- ═══════════════════════════════════════ Top bar ═══════════════════════════════════════ -->
  <div id="topbar" class="topbar">
    <div class="topbar-left">
      <!-- Apple-style logo -->
      <svg class="topbar-logo" viewBox="0 0 18 18" fill="none">
        <rect width="18" height="18" rx="4.5" fill="var(--accent)"/>
        <path d="M9 4L14.2 7.1V13.4L9 16.5L3.8 13.4V7.1Z" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/>
        <circle cx="9" cy="10.2" r="2.1" fill="white"/>
      </svg>
      <span class="topbar-brand">CloudDesktop</span>
    </div>

    <!-- Center: clock -->
    <div class="topbar-clock" id="topbar-clock"></div>

    <div class="topbar-right">
      <span class="topbar-stat">
        <span class="topbar-led" style="background:#30d158"></span>
        CPU <span id="topbar-cpu">0%</span>
      </span>
      <span class="topbar-stat">
        <span class="topbar-led" style="background:#0a84ff"></span>
        RAM <span id="topbar-ram">0%</span>
      </span>
      <span class="topbar-stat">
        <span class="topbar-led" style="background:#ff9f0a"></span>
        Disk <span id="topbar-disk">0%</span>
      </span>
      <span class="topbar-sep"></span>
      <span class="topbar-user" id="topbar-user"></span>
      <span class="topbar-sep"></span>
      <button class="topbar-btn topbar-bell" id="topbar-bell" title="Notifications" aria-label="Notifications">
        <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M10 13a2 2 0 01-4 0"/>
          <path d="M3.5 6.5a4.5 4.5 0 019 0c0 2.5 1 4 1.5 4.5H2c.5-.5 1.5-2 1.5-4.5z"/>
        </svg>
        <span class="bell-badge" id="bell-badge" hidden>0</span>
      </button>
      <button class="topbar-btn" id="topbar-theme" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor">
          <path d="M8 1a7 7 0 100 14A7 7 0 008 1zm0 1.5v11A5.5 5.5 0 018 2.5z"/>
        </svg>
      </button>
      <!-- Fullscreen -->
      <button class="topbar-btn" id="topbar-fullscreen" title="Fullscreen" aria-label="Fullscreen">
        <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M1 5V2h3M12 1h3v3M11 15h4v-4M5 15H1v-4"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Dock trigger (hover zone at very bottom) -->
  <div id="dock-trigger" class="dock-trigger"></div>

  <!-- ═══════════════════════════════════════ Dock ═══════════════════════════════════════ -->
  <div id="dock" class="dock" role="toolbar" aria-label="Application dock">

    <!-- ── App icons ── -->
    <div class="dock-section dock-apps" id="dock-apps">

      <!-- Terminal -->
      <button class="dock-item dock-app" data-app="terminal" data-label="Terminal">
        <div class="app-icon">
          <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="term-bg" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
                <stop stop-color="#1a1a2e"/>
                <stop offset="1" stop-color="#0d0d15"/>
              </linearGradient>
            </defs>
            <rect width="60" height="60" fill="url(#term-bg)"/>
            <rect x="5" y="8" width="50" height="44" rx="5" fill="#16213e"/>
            <rect x="5" y="8" width="50" height="10" rx="5" fill="#0f3460"/>
            <circle cx="13" cy="13" r="2.5" fill="#ff5f57"/>
            <circle cx="21" cy="13" r="2.5" fill="#febc2e"/>
            <circle cx="29" cy="13" r="2.5" fill="#28c840"/>
            <path d="M12 30l10 7-10 7" stroke="#30d158" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="27" y1="44" x2="44" y2="44" stroke="#30d158" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>
      </button>

      <!-- Firefox -->
      <button class="dock-item dock-app" data-app="firefox" data-label="Firefox">
        <img class="app-icon app-icon-img" src="/img/firefox.svg?cv=%CACHE_VERSION%" alt="Firefox" draggable="false">
      </button>

      <!-- Chrome -->
      <button class="dock-item dock-app" data-app="chrome" data-label="Chrome">
        <img class="app-icon app-icon-img" src="/img/chrome.svg?cv=%CACHE_VERSION%" alt="Chrome" draggable="false">
      </button>

      <!-- VS Code -->
      <button class="dock-item dock-app" data-app="vscode" data-label="VS Code">
        <img class="app-icon app-icon-img" src="/img/vscode.svg?cv=%CACHE_VERSION%" alt="VS Code" draggable="false">
      </button>

      <!-- Files -->
      <button class="dock-item dock-app" data-app="filemanager" data-label="Files">
        <div class="app-icon">
          <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="60" height="60" fill="#1565c0"/>
            <!-- Back folder -->
            <rect x="7" y="28" width="46" height="24" rx="5" fill="#0d47a1"/>
            <!-- Folder tab -->
            <path d="M8 28V24Q8 20 12 20H27Q31 20 32.5 24L36 28Z" fill="#1565c0"/>
            <!-- Front folder -->
            <rect x="7" y="30" width="46" height="22" rx="5" fill="#1976d2"/>
            <!-- Shine -->
            <rect x="7" y="30" width="46" height="9" rx="5" fill="rgba(255,255,255,0.1)"/>
            <!-- Paper stack inside -->
            <rect x="18" y="36" width="24" height="3" rx="1.5" fill="rgba(255,255,255,0.5)"/>
            <rect x="18" y="42" width="17" height="3" rx="1.5" fill="rgba(255,255,255,0.35)"/>
            <!-- Small folder on top left of desktop -->
            <rect x="8" y="10" width="18" height="14" rx="3" fill="#42a5f5"/>
            <path d="M8 14V12Q8 10 10 10H14Q16 10 17 12L19 14Z" fill="#1e88e5"/>
            <rect x="8" y="15" width="18" height="9" rx="3" fill="#64b5f6"/>
          </svg>
        </div>
      </button>


      <button class="dock-item dock-app" data-app="editor" data-label="Text Editor">
        <div class="app-icon">
          <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="editor-bg" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
                <stop stop-color="#34a853"/>
                <stop offset="1" stop-color="#1e6e33"/>
              </linearGradient>
            </defs>
            <rect width="60" height="60" fill="url(#editor-bg)"/>
            <!-- Paper sheet -->
            <rect x="10" y="7" width="32" height="40" rx="3.5" fill="white" opacity="0.96"/>
            <!-- Corner fold -->
            <path d="M34 7L42 15H34Z" fill="#e0e0e0"/>
            <path d="M34 7V15H42" fill="none" stroke="#bdbdbd" stroke-width="0.8"/>
            <!-- Text lines -->
            <line x1="16" y1="22" x2="36" y2="22" stroke="#4caf50" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="16" y1="29" x2="36" y2="29" stroke="#4caf50" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="16" y1="36" x2="28" y2="36" stroke="#4caf50" stroke-width="2.5" stroke-linecap="round"/>
            <!-- Pencil -->
            <g transform="rotate(-40 50 46)">
              <rect x="44" y="34" width="14" height="5.5" rx="2" fill="#fdd835"/>
              <polygon points="44,39.5 41,43 47,43" fill="#ff8f00"/>
              <rect x="44" y="34" width="1.5" height="5.5" fill="#f9a825"/>
              <rect x="56.5" y="34" width="3" height="5.5" rx="1" fill="#bdbdbd"/>
            </g>
          </svg>
        </div>
      </button>

    </div><!-- /dock-apps -->

    <div class="dock-sep"></div>

    <!-- ── Utilities ── -->
    <div class="dock-section">

      <button class="dock-item dock-util" id="btn-upload" data-label="Upload">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <path d="M19 14v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="15 7 11 3 7 7"/>
          <line x1="11" y1="3" x2="11" y2="14"/>
        </svg>
      </button>

      <button class="dock-item dock-util" id="btn-download" data-label="Download">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <path d="M19 14v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="7 10 11 14 15 10"/>
          <line x1="11" y1="14" x2="11" y2="3"/>
        </svg>
      </button>

      <button class="dock-item dock-util" id="btn-resolution" data-label="Resolution">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <rect x="1" y="3" width="20" height="13" rx="2"/>
          <line x1="7" y1="20" x2="15" y2="20"/>
          <line x1="11" y1="16" x2="11" y2="20"/>
        </svg>
      </button>

      <button class="dock-item dock-util" id="btn-fullscreen" data-label="Fullscreen">
        <svg class="fs-icon-expand" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H3v5"/><path d="M14 3h5v5"/><path d="M8 19H3v-5"/><path d="M14 19h5v-5"/>
        </svg>
        <svg class="fs-icon-compress" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" hidden>
          <path d="M3 8h5V3"/><path d="M19 8h-5V3"/><path d="M3 14h5v5"/><path d="M19 14h-5v5"/>
        </svg>
      </button>

    </div>

    <div class="dock-sep"></div>

    <!-- ── Controls ── -->
    <div class="dock-section">

      <button class="dock-item dock-util" id="btn-windows" data-label="Windows">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <rect x="2" y="2" width="8" height="6" rx="1.5"/>
          <rect x="12" y="2" width="8" height="6" rx="1.5"/>
          <rect x="2" y="14" width="8" height="6" rx="1.5"/>
          <rect x="12" y="14" width="8" height="6" rx="1.5"/>
        </svg>
      </button>

      <button class="dock-item dock-util" id="btn-keys" data-label="Ctrl+Alt+Del">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <rect x="1" y="5" width="20" height="12" rx="2"/>
          <circle cx="5" cy="11" r="0.5" fill="currentColor"/>
          <circle cx="9" cy="11" r="0.5" fill="currentColor"/>
          <circle cx="13" cy="11" r="0.5" fill="currentColor"/>
          <circle cx="17" cy="11" r="0.5" fill="currentColor"/>
          <line x1="7" y1="14" x2="15" y2="14"/>
        </svg>
      </button>

      <button class="dock-item dock-util" id="btn-restart" data-label="Restart Desktop">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <path d="M1 4v5h5"/>
          <path d="M3.51 13a9 9 0 102.13-8.36L1 9"/>
        </svg>
      </button>


      <button class="dock-item dock-util" id="btn-settings" data-label="Settings">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <circle cx="11" cy="11" r="3"/>
          <path d="M19.4 14a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V20a2 2 0 01-4 0v-.09A1.65 1.65 0 008 18.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 003.68 14a1.65 1.65 0 00-1.51-1H2a2 2 0 010-4h.09A1.65 1.65 0 003.6 8a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 008 3.68a1.65 1.65 0 001-1.51V2a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 8a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
      </button>


    </div>

  </div><!-- /dock -->

  <!-- Window switcher popup -->
  <div id="window-list" class="window-list" hidden>
    <div class="window-list-header">Open Windows</div>
    <div id="window-list-items" class="window-list-items">
      <div class="window-list-empty">No windows open</div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════ Modals ═══════════════════════════════════════ -->

  <!-- Resolution -->
  <div id="resolution-modal" class="modal" hidden>
    <div class="modal-card">
      <h3>Display Resolution</h3>
      <div class="res-grid">
        <button class="res-btn" data-w="1920" data-h="1080">1920 × 1080</button>
        <button class="res-btn" data-w="1600" data-h="900">1600 × 900</button>
        <button class="res-btn" data-w="1440" data-h="900">1440 × 900</button>
        <button class="res-btn" data-w="1366" data-h="768">1366 × 768</button>
        <button class="res-btn" data-w="1280" data-h="720">1280 × 720</button>
        <button class="res-btn" data-w="0" data-h="0" id="res-fit">Fit Window</button>
      </div>
      <button id="resolution-close" class="btn-ghost" style="margin-top:14px">Close</button>
    </div>
  </div>

  <!-- Settings -->
  <div id="settings-modal" class="modal" hidden>
    <div class="modal-card">
      <h3>Settings</h3>
      <div class="setting-row">
        <span class="setting-label">Theme</span>
        <button id="settings-theme" class="toggle-btn">Dark</button>
      </div>
      <div class="setting-row">
        <span class="setting-label">Dock Auto-hide</span>
        <button id="settings-autohide" class="toggle-btn">Off</button>
      </div>
      <div class="setting-row">
        <span class="setting-label">Top Bar</span>
        <button id="settings-topbar" class="toggle-btn">On</button>
      </div>
 <button id="settings-close" class="btn-ghost" style="margin-top:18px">Close</button>
      <p id="settings-version" class="settings-version" hidden></p>
    </div>
  </div>

  <!-- Transfer Manager Panel (uploads + downloads) -->
  <div id="upload-manager" class="upload-manager" hidden>
    <div class="upload-manager-header">
      <span class="upload-manager-title">Transfers</span>
      <span class="upload-manager-count" id="upload-count"></span>
      <div class="upload-manager-actions">
        <button class="upload-manager-btn" id="upload-minimize" title="Minimize">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="8" x2="13" y2="8"/></svg>
        </button>
        <button class="upload-manager-btn" id="upload-close-mgr" title="Close">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="3" x2="13" y2="13"/><line x1="13" y1="3" x2="3" y2="13"/></svg>
        </button>
      </div>
    </div>
    <div class="upload-manager-body" id="upload-list"></div>
  </div>

  <!-- Upload Modal -->
  <div id="upload-modal" class="modal" hidden>
    <div class="modal-card">
      <h3>Upload Files</h3>
      <div class="upload-dropzone" id="upload-dropzone">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <p>Drop files or click to browse</p>
        <input type="file" id="upload-file-input" multiple hidden>
      </div>
      <div class="upload-selected-files" id="upload-selected"></div>
      <label class="field-label" style="margin-top:12px">Destination Directory</label>
      <div class="upload-dir-row">
        <input type="text" id="upload-dest-input" value="/root/Desktop" spellcheck="false" autocomplete="off">
        <button id="upload-browse-dir" class="btn-ghost" style="padding:10px 12px">Browse</button>
      </div>
      <div class="modal-row" style="margin-top:14px">
        <button id="upload-start-btn" class="btn-primary" disabled>Upload</button>
        <button id="upload-cancel-btn" class="btn-ghost">Cancel</button>
      </div>
    </div>
  </div>

  <!-- File Browser Modal (for downloads) -->
  <div id="filebrowser-modal" class="modal" hidden>
    <div class="modal-card" style="max-width:500px">
      <h3>Download Files</h3>
      <div class="fb-nav">
        <button class="fb-nav-btn" id="fb-back" title="Back">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 2L4 8l6 6"/></svg>
        </button>
        <input type="text" id="fb-path-input" class="fb-path-input" value="/root" spellcheck="false" autocomplete="off">
        <button class="fb-nav-btn" id="fb-go" title="Go">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
        </button>
      </div>
      <div class="fb-list" id="fb-list"></div>
      <button id="fb-close" class="btn-ghost" style="margin-top:14px">Close</button>
    </div>
  </div>

  <!-- Directory Browser Modal -->
  <div id="dir-modal" class="modal" hidden>
    <div class="modal-card">
      <h3>Choose Directory</h3>
      <div class="dir-path" id="dir-path">/root</div>
      <div class="dir-list" id="dir-list"></div>
      <div class="modal-row" style="margin-top:14px">
        <button id="dir-select-btn" class="btn-primary">Select</button>
