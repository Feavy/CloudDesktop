name: Publish images

# Builds the container images and pushes them to this project's GitHub
# Container Registry (ghcr.io). No registry credentials are needed: the
# workflow uses the automatically-issued GITHUB_TOKEN.
#
#   ghcr.io/<owner>/clouddesktop-client   web client only, ~150 MB. For when
#                                         the desktop already runs elsewhere.
#   ghcr.io/<owner>/clouddesktop-desktop  XFCE + TigerVNC + websockify, no
#                                         Node.js. Pair with the client.
#   ghcr.io/<owner>/clouddesktop-full     all three in one image, ~2.5 GB.
#
# Tags produced:
#   main / v* push : <branch>, latest (on main), and semver tags
#   pull request   : pr-<number> and sha-<short>  -- snapshot tags for testing
#                    before merge. `latest` is never produced from a PR.
#
# Pull requests from forks are built but NOT pushed: GitHub issues those runs a
# read-only GITHUB_TOKEN, so the push would fail. Open the PR inside this repo
# to get a testable snapshot.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      push:
        description: "Push the images to the registry"
        type: boolean
        default: true
      platforms:
        description: "Target platforms (multi-arch builds are slow)"
        type: string
        default: "linux/amd64"

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

concurrency:
  # Stable per-PR group, so a superseded run is cancelled rather than racing to
  # overwrite the same pr-<number> tag.
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prep:
    name: Resolve registry coordinates
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.vars.outputs.owner }}
      push: ${{ steps.vars.outputs.push }}
      reason: ${{ steps.vars.outputs.reason }}
      base_tag: ${{ steps.vars.outputs.base_tag }}
      build_time: ${{ steps.vars.outputs.build_time }}
    steps:
      - id: vars
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          DISPATCH_PUSH: ${{ inputs.push }}
          COMMIT_TIME: ${{ github.event.head_commit.timestamp }}
        run: |
          # GHCR requires a lowercase owner; GitHub exposes the original casing.
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=$owner" >> "$GITHUB_OUTPUT"

          push=false
          reason="no push requested"

          if [ "$EVENT" = "push" ]; then
            push=true
            reason="push to ${GITHUB_REF_NAME}"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            push="$DISPATCH_PUSH"
            reason="manual dispatch (push=${DISPATCH_PUSH})"
          elif [ "$EVENT" = "pull_request" ]; then
            if [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" = "$BASE_REPO" ]; then
              push=true
              reason="pull request snapshot from this repo"
            else
              push=false
              reason="pull request from a fork (${HEAD_REPO:-unknown}) - token is read-only, building only"
            fi
          fi

          echo "push=$push"     >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

          # Build timestamp baked into the client's settings caption. Only push
          # and tag events carry head_commit; for the rest (pull requests,
          # manual dispatch) fall back to the moment this run started. It is
          # resolved once here so every image in the run is stamped alike, and
          # the commit time keeps rebuilds of the same commit reproducible —
          # same sources, same stamped time, docker layer cache stays valid.
          build_time="$COMMIT_TIME"
          if [ -z "$build_time" ]; then
            build_time=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          fi
          echo "build_time=$build_time" >> "$GITHUB_OUTPUT"

          # clouddesktop-full is built FROM clouddesktop-desktop so it does not
          # re-install XFCE. It must use the desktop image this run produced,
          # not a previously published tag, otherwise a PR that edits
          # install.sh would silently get main's desktop layer as its base.
          # The sha tag is immutable, so it can never go stale mid-run.
          echo "base_tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          {
            echo "### Registry resolution"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| owner | $owner |"
            echo "| push | $push |"
            echo "| reason | $reason |"
            echo "| build time | $build_time |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.image.name }}
    # Runs on pull requests too, to catch a broken build before merge. The
    # push step below is what honours needs.prep.outputs.push.
    #
    # clouddesktop-full is NOT in this matrix: it is built FROM the desktop
    # image, so it needs this job to have finished and pushed. See build-full.
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: clouddesktop-client
            dockerfile: Dockerfile.client
            context: .
          - name: clouddesktop-desktop
            dockerfile: Dockerfile.desktop
            context: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: contains(inputs.platforms || 'linux/amd64', 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        # Only when we intend to push. A fork pull request gets a read-only
        # token, and attempting to log in there would fail the job rather than
        # just skipping the push.
        if: needs.prep.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prep.outputs.owner }}/${{ matrix.image.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Gated on the default branch, so a pull request can never
            # overwrite :latest with an unmerged snapshot.
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: ${{ needs.prep.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache-busting version and build timestamp stamped into the client
          # (asset URLs and the settings caption), so a new deployment is
          # picked up without a hard reload. Dockerfile.desktop ignores both
          # (it ships no client files) but passing them is harmless.
          build-args: |
            CACHE_VERSION=${{ github.run_number }}
            BUILD_DATETIME=${{ needs.prep.outputs.build_time }}
          # The all-in-one image installs XFCE and is multi-gigabyte; without
          # this every rebuild starts from scratch.
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
          # Provenance/SBOM attestations build an extra manifest that older
          # containerd cannot resolve by tag, which breaks `kubectl pull`.
          provenance: false
          sbom: false

      - name: Summarise
        if: always()
        env:
          PUSHED: ${{ needs.prep.outputs.push }}
          REASON: ${{ needs.prep.outputs.reason }}
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE: ${{ matrix.image.name }}
          OWNER: ${{ needs.prep.outputs.owner }}
        run: |
          # Assigned with single quotes and expanded via "$FENCE", so the
          # backticks never pass through a quoted string literal. Writing
          # echo "```" makes bash start a command substitution that never
          # ends: "unexpected EOF while looking for matching `'".
          FENCE='```'

          {
            echo "### $IMAGE"
            echo ""
            echo "push: $PUSHED — $REASON"
            echo ""
            echo "$FENCE"
            echo "$TAGS"
            echo "$FENCE"
            if [ "$PUSHED" = "true" ] && [ '${{ github.event_name }}' = "pull_request" ]; then
              echo ""
              echo "Test before merging:"
              echo ""
              echo "${FENCE}bash"
              echo "kubectl set image deployment/desktop-web web=ghcr.io/$OWNER/$IMAGE:pr-${{ github.event.pull_request.number }} -n <namespace>"
              echo "$FENCE"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
  build-full:
    name: Build clouddesktop-full
    # Built on top of the desktop image this same run produced, rather than
    # re-installing XFCE from scratch. Waiting on `build` guarantees the base
    # exists and matches the current commit.
    #
    # Skipped when nothing is pushed (a fork pull request), because then there
    # is no freshly-built base tag in the registry to pull. Those runs still
    # produce client and desktop, neither of which has a base dependency.
    needs: [prep, build]
    if: needs.prep.outputs.push == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: contains(inputs.platforms || 'linux/amd64', 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        if: needs.prep.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prep.outputs.owner }}/clouddesktop-full
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.full
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: ${{ needs.prep.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ needs.prep.outputs.owner }}/clouddesktop-desktop:${{ needs.prep.outputs.base_tag }}
            CACHE_VERSION=${{ github.run_number }}
            BUILD_DATETIME=${{ needs.prep.outputs.build_time }}
          cache-from: type=gha,scope=clouddesktop-full
          cache-to: type=gha,mode=max,scope=clouddesktop-full
          provenance: false
          sbom: false

      - name: Summarise
        if: always()
        env:
          PUSHED: ${{ needs.prep.outputs.push }}
          REASON: ${{ needs.prep.outputs.reason }}
          TAGS: ${{ steps.meta.outputs.tags }}
          OWNER: ${{ needs.prep.outputs.owner }}
          BASE: ${{ env.REGISTRY }}/${{ needs.prep.outputs.owner }}/clouddesktop-desktop:${{ needs.prep.outputs.base_tag }}
        run: |
          FENCE='```'
          {
            echo "### clouddesktop-full"
            echo ""
            echo "push: $PUSHED — $REASON"
            echo ""
            echo "base image: $BASE"
            echo ""
            echo "$FENCE"
            echo "$TAGS"
            echo "$FENCE"
            if [ "$PUSHED" = "true" ] && [ '${{ github.event_name }}' = "pull_request" ]; then
              echo ""
              echo "Test before merging:"
              echo ""
              echo "${FENCE}bash"
              echo "kubectl set image deployment/desktop-web web=ghcr.io/$OWNER/clouddesktop-full:pr-${{ github.event.pull_request.number }} -n <namespace>"
              echo "$FENCE"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy
    # Only when images were actually pushed; the immutable sha tag is the new unique tag.
    needs: [prep, build, build-full]
    if: needs.prep.outputs.push == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: feavy/deploy@main
        env:
          DEPLOYMENT: experimental-workspace
          BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
          FILE_PATH: "kubernetes/apps/workspaces/experimental-workspace.yaml"
          YAML_PATH: ".spec.values.apps.experimental-workspace.image.tag"
          TAG: ${{ needs.prep.outputs.base_tag }}
